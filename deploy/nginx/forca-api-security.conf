# deploy/nginx/forca-api-security.conf
# Headers defensivos do vhost da API do ForcaApp.
# Fecha INFRA-01 e INFRA-02 do review defensivo de 31/07/2026.
#
# Instalação na VPS (uma vez por ambiente):
#   scp deploy/nginx/forca-api-security.conf \
#       root@<vps>:/etc/nginx/snippets/forca-api-security.conf
# e, dentro do bloco `server { ... listen 443 ssl; }` do vhost:
#   include snippets/forca-api-security.conf;
# depois: nginx -t && systemctl reload nginx
#
# Por que um snippet incluído em vez de linhas soltas no vhost: os vhosts
# daqui são editados pelo Certbot, que reescreve o arquivo. Uma linha solta
# some numa renovação sem ninguém perceber; o `include` sobrevive.
#
# ATENÇÃO ao herdar: `add_header` no nginx NÃO acumula entre níveis. Se algum
# dia um `location` deste vhost declarar o próprio `add_header`, ele descarta
# TODOS os headers herdados deste snippet — e o bloco volta a responder sem
# HSTS silenciosamente. Nesse caso, inclua este arquivo também no `location`.

# INFRA-02: o header `Server` respondia `nginx/1.24.0 (Ubuntu)` — versão exata
# e distribuição. Escopo de server block de propósito: o `server_tokens off`
# global do nginx.conf vale para todos os vhosts da máquina, que hospedam
# outros projetos, e mudá-lo aqui seria mexer fora do ForcaApp.
server_tokens off;

# INFRA-01: HSTS. O redirect 80 -> 443 já existe, mas ele só age DEPOIS que o
# primeiro request em texto claro saiu. O HSTS instrui o cliente a nunca mais
# tentar HTTP. Sem `preload` — isso é decisão que atravessa o domínio inteiro.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Impede o consumidor navegador de adivinhar tipo de conteúdo diferente do
# application/json declarado.
add_header X-Content-Type-Options "nosniff" always;

# A API não é feita para ser enquadrada nem para vazar URL de origem.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Esta origem só devolve JSON: nada deve ser carregado a partir dela.
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

# `always` em todos: sem ele o header não sai em resposta de erro — e é
# justamente o 405 do TRACE e os 4xx que o scanner externo colhe primeiro.
