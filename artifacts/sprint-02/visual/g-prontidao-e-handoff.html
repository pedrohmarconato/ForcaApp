<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Prontidão e handoff</title><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0B0B0C; color: #F5F5F5;
         font-family: Inter, -apple-system, system-ui, sans-serif; padding: 16px; }
  .tela { display: flex; flex-direction: column; gap: 12px; }
  .duplo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: #101315; border-radius: 14px; padding: 14px; }
  .titulo { font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
            color: #A0A0A5; margin-bottom: 8px; }
  .linha { display: flex; align-items: center; justify-content: space-between; }
  .chip { font-size: 10px; padding: 4px 10px; border-radius: 999px;
          background: rgba(255,255,255,.08); color: #F5F5F5; }
  .chip.on { background: #C8FF00; color: #000; }
  .btn { display: block; text-align: center; padding: 12px; border-radius: 12px;
         background: #C8FF00; color: #000; font-weight: 700; font-size: 13px; }
  .btn.sec { background: transparent; color: #F5F5F5;
             border: 1px solid rgba(255,255,255,.18); }
  .btn.off { opacity: .4; }
  .aviso { border-left: 3px solid #D8B15C; padding-left: 10px; font-size: 12px;
           color: #A0A0A5; }
  .info { border-left: 3px solid #C8FF00; padding-left: 10px; font-size: 12px;
          color: #A0A0A5; }
  .codigo { font-size: 34px; letter-spacing: .22em; text-align: center; font-weight: 800; }
  .link { font-size: 11px; color: #A0A0A5; text-align: center; }
  .rot { font-size: 10px; color: #A0A0A5; text-transform: uppercase;
         letter-spacing: .1em; margin-bottom: 6px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  h2 { font-size: 14px; }
  p { font-size: 12px; color: #A0A0A5; }
</style></head>
<body>
  <!-- Cenário: Prontidão e handoff — Estado: um pronto · ambos prontos · active (sem player) -->
  <div class="rot">Prontidão e handoff · um pronto · ambos prontos · active (sem player)</div>
  <div class="tela"><div class="card"><div class="titulo">Um pronto</div><div class="linha"><span class="chip on">Você: pronto</span><span class="chip">Parceiro: aguardando</span></div><div style="height:10px"></div><div class="btn sec">Não estou pronto</div></div><div class="card"><div class="titulo">Ambos prontos</div><div class="linha"><span class="chip on">Você: pronto</span><span class="chip on">Parceiro: pronto</span></div></div><div class="card"><div class="titulo">Treino iniciado</div><div class="info">Treino iniciado.<br>A execução revezada chega na próxima etapa do app.</div></div></div>
</body></html>
