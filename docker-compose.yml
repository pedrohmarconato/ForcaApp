# docker-compose.yml — backend do ForcaApp para VPS Hostinger
# Deploy: apontar a ferramenta de projetos da VPS para este repositório
# (ela clona e sobe este arquivo). As variáveis de ambiente do projeto
# (SUPABASE_URL, SUPABASE_ANON_KEY, ANTHROPIC_API_KEY...) são injetadas
# pela plataforma — NUNCA commitar o .env.
#
# O nome é `.yml`, não `.yaml`, de propósito: o Compose prefere `.yml` quando
# os dois existem. Enquanto o versionado se chamava `.yaml`, qualquer cópia
# `.yml` largada na VPS vencia em silêncio e as mudanças feitas aqui nunca
# chegavam em produção — foi assim que o CORS de produção ficou no default de
# desenvolvimento até 27/07/2026. Com o versionado ocupando o nome vencedor,
# uma edição manual na VPS aparece como arquivo modificado no `git status`.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # INFRA-03: contenção do container. A imagem já roda como não-root (USER
    # forca no Dockerfile); estas quatro linhas fecham o resto da superfície.
    #
    # read_only + tmpfs: o rootfs deixa de ser gravável, e /tmp existe só em
    # memória. O backend não escreve em disco — o que ele produz vai para o
    # Supabase. Se algum dia precisar de um caminho gravável, acrescente-o como
    # tmpfs aqui em vez de reabrir o rootfs inteiro.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # Default seguro: só loopback. Na VPS a chain DOCKER-USER está vazia e
      # porta publicada pelo Docker FURA o UFW — 0.0.0.0 aqui já expôs o
      # gunicorn à internet quando o override de produção faltou. Para testar
      # no device físico em dev: FORCA_BIND_HOST=0.0.0.0 docker compose up
      - "${FORCA_BIND_HOST:-127.0.0.1}:5001:5001"
    environment:
      # Obrigatórias (sem default): auth e IA falham sem elas
      SUPABASE_URL: ${SUPABASE_URL:?defina SUPABASE_URL no ambiente do projeto}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?defina SUPABASE_ANON_KEY no ambiente do projeto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?defina ANTHROPIC_API_KEY no ambiente do projeto}
      # PUSH-02: usada SÓ por push_reminder_scheduler.py (processo interno,
      # thread única) para ler/marcar planned_sessions across-user na hora do
      # lembrete diário — bypassa RLS por design, nunca usada em nenhuma rota
      # HTTP alcançável pelo cliente (T-13-06).
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?defina SUPABASE_SERVICE_ROLE_KEY no ambiente do projeto (Supabase Dashboard -> Settings -> API -> service_role key) — usado SÓ pelo scheduler de lembrete para ler across-user}
      # PUSH-01/02/03: assinatura VAPID do Web Push (pywebpush). A privada é a
      # base64url do escalar bruto (32 bytes) — formato que py_vapid
      # Vapid.from_string aceita; NUNCA commitar nem logar. O subject é o
      # contato mailto: exigido pelo protocolo. Sem estas linhas o compose não
      # REPASSAVA a chave ao container mesmo que ela existisse no .env —
      # environment: é allowlist explícita.
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?defina VAPID_PRIVATE_KEY (base64url do escalar EC P-256; gerar com py-vapid — ver 13-SPIKE.md)}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?defina VAPID_SUBJECT (ex. mailto:contato@dominio) — claim sub do VAPID}
      # Sem default de propósito. O default antigo era `localhost` — um valor de
      # desenvolvimento que em produção não quebra nada no servidor: o browser é
      # que bloqueia a resposta, e o app mostra "Network Error". Ficou assim em
      # produção sem ninguém perceber até 27/07/2026. Faltando a variável, o
      # Compose agora se recusa a subir em vez de degradar em silêncio.
      CORS_ORIGINS: ${CORS_ORIGINS:?defina CORS_ORIGINS com as origens do app (ex. https://forca-app-six.vercel.app,http://localhost:8081)}
      # Opcionais com default sensato
      CLAUDE_MODEL_NAME: ${CLAUDE_MODEL_NAME:-claude-sonnet-4-6}
      CHAT_MODEL_NAME: ${CHAT_MODEL_NAME:-claude-haiku-4-5}
      PLAN_MODEL_NAME: ${PLAN_MODEL_NAME:-claude-opus-5}
      FORCA_USE_MOLDE_ARCHITECTURE: ${FORCA_USE_MOLDE_ARCHITECTURE:-false}
      # Prompt do molde em system (estável) + user (dados do aluno), na ordem
      # que o prompt caching exige. Default false = prompt de hoje, byte a byte.
      FORCA_PROMPT_MOLDE_V2: ${FORCA_PROMPT_MOLDE_V2:-false}
      # Schema via output_config.format em vez de colado no texto do prompt.
      # -18% de tokens de entrada por geração e JSON com forma garantida.
      FORCA_STRUCTURED_OUTPUT: ${FORCA_STRUCTURED_OUTPUT:-false}
      # Esforço do modelo no molde (low|medium|high|xhigh|max). Vazio = default
      # da API (high) = comportamento atual. É a alavanca de latência e custo —
      # max_tokens é só um teto, não acelera nada.
      PLAN_EFFORT: ${PLAN_EFFORT:-}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-240}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-10}
      CHAT_RATE_WINDOW_SECONDS: ${CHAT_RATE_WINDOW_SECONDS:-60}
      PLAN_RATE_LIMIT: ${PLAN_RATE_LIMIT:-3}
      PLAN_RATE_WINDOW_SECONDS: ${PLAN_RATE_WINDOW_SECONDS:-3600}
      # Teto DIÁRIO por usuário, persistido no Supabase (migrations 0024/0025).
      # Os limites acima são barreira de burst em memória: zeram no restart e
      # não valem entre réplicas. Estes sobrevivem e contam cada tentativa
      # paga, inclusive o retry do molde.
      #
      # Chamadas por ROTA, porque as três não custam a mesma coisa: o chat é
      # Haiku e acontece dezenas de vezes num onboarding conversado; o plano é
      # Opus e acontece poucas vezes. Um teto único somando as três barrava o
      # usuário na geração do plano depois de uma conversa longa.
      AI_DAILY_CALL_LIMIT_CHAT: ${AI_DAILY_CALL_LIMIT_CHAT:-250}
      AI_DAILY_CALL_LIMIT_CONSOLIDATE: ${AI_DAILY_CALL_LIMIT_CONSOLIDATE:-30}
      AI_DAILY_CALL_LIMIT_PLAN: ${AI_DAILY_CALL_LIMIT_PLAN:-15}
      # Gasto do dia inteiro, somando as rotas. É esta a trava que segura o
      # Opus — a contagem acima existe para cortar loop acidental.
      AI_DAILY_USD_LIMIT: ${AI_DAILY_USD_LIMIT:-5.00}
      # Lembrete diário de treino (PUSH-02): default false — a thread do
      # scheduler nunca sobe em testes/dev sem opt-in explícito. Produção
      # liga com true (checkpoint do dono no Plano 13-04).
      PUSH_REMINDER_SCHEDULER_ENABLED: ${PUSH_REMINDER_SCHEDULER_ENABLED:-false}
      FLASK_DEBUG: "false"
      PORT: "5001"
