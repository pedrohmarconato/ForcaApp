name: Session contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/sessao-treinamento-refresh-adaptacoes]

permissions:
  contents: read

jobs:
  verify:
    name: Verify session contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: npx tsc --noEmit
      - run: npx jest --runInBand --silent
      - run: python -m pytest backend/tests -q
      - run: npx expo export --platform web --output-dir /tmp/forcaapp-session-fix-web
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://localhost:8791
          EXPO_PUBLIC_SUPABASE_ANON_KEY: harness-anon-key
