# docker-compose.yaml — backend do ForcaApp para VPS Hostinger
# Deploy: apontar a ferramenta de projetos da VPS para este repositório
# (ela clona e sobe este arquivo). As variáveis de ambiente do projeto
# (SUPABASE_URL, SUPABASE_ANON_KEY, ANTHROPIC_API_KEY...) são injetadas
# pela plataforma — NUNCA commitar o .env.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      # Default seguro: só loopback. Na VPS a chain DOCKER-USER está vazia e
      # porta publicada pelo Docker FURA o UFW — 0.0.0.0 aqui já expôs o
      # gunicorn à internet quando o override de produção faltou. Para testar
      # no device físico em dev: FORCA_BIND_HOST=0.0.0.0 docker compose up
      - "${FORCA_BIND_HOST:-127.0.0.1}:5001:5001"
    environment:
      # Obrigatórias (sem default): auth e IA falham sem elas
      SUPABASE_URL: ${SUPABASE_URL:?defina SUPABASE_URL no ambiente do projeto}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?defina SUPABASE_ANON_KEY no ambiente do projeto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?defina ANTHROPIC_API_KEY no ambiente do projeto}
      # Opcionais com default sensato
      CLAUDE_MODEL_NAME: ${CLAUDE_MODEL_NAME:-claude-sonnet-4-6}
      CHAT_MODEL_NAME: ${CHAT_MODEL_NAME:-claude-haiku-4-5}
      PLAN_MODEL_NAME: ${PLAN_MODEL_NAME:-claude-opus-4-8}
      FORCA_USE_MOLDE_ARCHITECTURE: ${FORCA_USE_MOLDE_ARCHITECTURE:-false}
      # Prompt do molde em system (estável) + user (dados do aluno), na ordem
      # que o prompt caching exige. Default false = prompt de hoje, byte a byte.
      FORCA_PROMPT_MOLDE_V2: ${FORCA_PROMPT_MOLDE_V2:-false}
      # Schema via output_config.format em vez de colado no texto do prompt.
      # -18% de tokens de entrada por geração e JSON com forma garantida.
      FORCA_STRUCTURED_OUTPUT: ${FORCA_STRUCTURED_OUTPUT:-false}
      # Esforço do modelo no molde (low|medium|high|xhigh|max). Vazio = default
      # da API (high) = comportamento atual. É a alavanca de latência e custo —
      # max_tokens é só um teto, não acelera nada.
      PLAN_EFFORT: ${PLAN_EFFORT:-}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-240}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-10}
      CHAT_RATE_WINDOW_SECONDS: ${CHAT_RATE_WINDOW_SECONDS:-60}
      PLAN_RATE_LIMIT: ${PLAN_RATE_LIMIT:-3}
      PLAN_RATE_WINDOW_SECONDS: ${PLAN_RATE_WINDOW_SECONDS:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:19006}
      FLASK_DEBUG: "false"
      PORT: "5001"
